<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jellyfish Finger — 手势水母</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#8FE6CC;
    --mint-soft:#BFF3E4;
    --aqua:#A9D8EE;
    --lilac:#CFC0F0;
    --cream:#FFF8EC;
    --ink:rgba(255,255,255,.86);
    --ink-dim:rgba(255,255,255,.55);
    --ui: ui-sans-serif, -apple-system, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --display: "Cormorant Garamond", "Songti SC", Didot, Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#9FB6C6;overflow:hidden;
    font-family:var(--ui);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
  }
  #cam{position:fixed;left:-10000px;top:0;width:240px;height:135px;opacity:.01;pointer-events:none}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%}

  /* ---------- chrome ---------- */
  #ui{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease .2s}
  #ui.on{opacity:1}
  .lbl{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-dim)}

  .brand{position:absolute;top:26px;left:30px;display:flex;align-items:center;gap:14px}
  .brand i{width:18px;height:18px;border:1px solid rgba(255,255,255,.5);border-radius:50%;display:block}

  .tools{position:absolute;top:22px;right:26px;display:flex;gap:8px}
  .chip{
    pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.28);color:var(--ink-dim);
    padding:7px 13px;border-radius:999px;font-size:10px;letter-spacing:.22em;
    text-transform:uppercase;font-family:var(--ui);backdrop-filter:blur(6px);
    transition:.25s ease;
  }
  .chip:hover{color:var(--ink);border-color:rgba(255,255,255,.5)}
  .chip[aria-pressed="true"]{background:rgba(143,230,204,.26);border-color:rgba(143,230,204,.75);color:#EAFFF7}

  .side{position:absolute;left:30px;top:50%;transform:translateY(-50%)}
  .side h1{
    font-family:var(--display);font-weight:300;font-size:clamp(30px,4.4vw,56px);
    line-height:1.35;letter-spacing:.14em;margin:0 0 22px;color:rgba(255,255,255,.94);
    text-shadow:0 0 26px rgba(190,240,225,.45);
  }
  .side .rule{width:1px;height:64px;background:linear-gradient(rgba(255,255,255,.5),transparent);margin:0 0 16px 3px}
  .side p{margin:0;line-height:2.1}

  .track{position:absolute;left:30px;bottom:30px;display:flex;align-items:center;gap:11px}
  .track b{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35);
    box-shadow:0 0 0 0 rgba(143,230,204,.6);transition:.3s}
  .track.live b{background:var(--mint);box-shadow:0 0 14px 3px rgba(143,230,204,.65)}

  .hint{position:absolute;left:0;right:0;bottom:32px;text-align:center;transition:opacity .4s}
  .coach{position:absolute;left:0;right:0;bottom:20px;text-align:center;display:flex;
    gap:6px;justify-content:center}
  .coach b{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.22);transition:.4s}
  .coach b.ok{background:rgba(143,230,204,.75)}
  .coach b.now{background:rgba(255,255,255,.9);transform:scale(1.35)}

  /* ---------- gate · glass ---------- */
  /* 和水母场景同源:冷蓝紫渐变 + 两团淡彩水洗 + 中心呼吸发光体 + 磨砂玻璃按钮。
     标题用场景同一支 Cormorant Garamond 斜体细字,通透发光,不是压花也不是针脚。 */
  #gate{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(80% 60% at 18% 12%, rgba(175,232,214,.42), transparent 60%),
      radial-gradient(75% 65% at 88% 92%, rgba(214,196,242,.46), transparent 60%),
      linear-gradient(160deg,#A6BFD0 0%,#B6C8D6 48%,#CFC6E0 100%);
    z-index:20;transition:opacity .9s ease;padding:24px;overflow:hidden;
    color:rgba(255,255,255,.86);
  }
  #gate.hide{opacity:0;pointer-events:none}
  .card{max-width:460px;text-align:center;position:relative;z-index:1}

  /* 中心呼吸发光体 —— 呼应水母 */
  .card .halo{position:relative;width:118px;height:118px;margin:0 auto 32px}
  .card .halo::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.95),rgba(191,243,228,.4) 42%,transparent 70%);
    animation:breathe 3.8s ease-in-out infinite}
  .card .halo::after{content:"";position:absolute;inset:34% 34%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);
    filter:blur(3px);animation:breathe 3.8s ease-in-out infinite .3s}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.14);opacity:1}}

  .card h2{font-family:var(--display);font-weight:300;font-style:italic;
    font-size:clamp(40px,10vw,56px);line-height:1.02;letter-spacing:.04em;color:#fff;margin:0 0 4px;
    text-shadow:0 0 30px rgba(200,245,232,.55),0 2px 20px rgba(150,180,200,.3)}
  .card .kicker{font-size:11px;letter-spacing:.5em;text-transform:uppercase;
    color:rgba(255,255,255,.6);margin:10px 0 30px}
  .card p{font-size:14px;line-height:2.1;color:rgba(255,255,255,.78);
    margin:0 0 36px;letter-spacing:.05em;font-weight:300}

  .btn{
    pointer-events:auto;cursor:pointer;font-family:var(--ui);font-size:12px;
    letter-spacing:.34em;text-transform:uppercase;color:#fff;
    padding:16px 40px;border-radius:999px;
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 4px 30px rgba(120,150,170,.18),inset 0 1px 0 rgba(255,255,255,.3);
    transition:.3s ease;
  }
  .btn:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
  .btn[disabled]{opacity:.5;cursor:default;transform:none}
  .alt{display:block;margin:22px auto 0;background:none;border:0;color:rgba(255,255,255,.55);
    font-family:var(--ui);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
    cursor:pointer;pointer-events:auto;transition:.3s}
  .alt:hover{color:#fff}
  .note{margin-top:28px;font-size:11px;line-height:1.9;letter-spacing:.05em;
    color:rgba(255,255,255,.62);min-height:16px;text-transform:none;max-width:400px}
  .note b{color:#EAFFF7;font-weight:400;background:rgba(255,255,255,.12);
    padding:2px 6px;border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:0}

  /* ---------- 录制 ---------- */
  .rec{position:absolute;right:30px;bottom:28px;width:52px;height:52px;padding:0;
    background:none;border:0;cursor:pointer;pointer-events:auto;display:grid;place-items:center}
  .rec svg{position:absolute;inset:0;width:52px;height:52px;transform:rotate(-90deg)}
  .rec circle{fill:none;stroke-width:1.2}
  .rec .trk{stroke:rgba(255,255,255,.28)}
  .rec .prg{stroke:rgba(143,230,204,.95);stroke-dasharray:132;stroke-dashoffset:132}
  .rec.on .prg{animation:ring var(--dur,10s) linear forwards}
  @keyframes ring{from{stroke-dashoffset:132}to{stroke-dashoffset:0}}
  .rec i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.85);
    transition:.28s cubic-bezier(.4,0,.2,1)}
  .rec:hover i{background:#fff;transform:scale(1.1)}
  .rec.on i{border-radius:3px;width:12px;height:12px;background:#8FE6CC}
  .rec[hidden]{display:none}

  .shot{position:absolute;right:30px;bottom:96px;width:280px;padding:12px;
    border-radius:16px;background:rgba(28,42,54,.42);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.22);pointer-events:auto;
    animation:pop .35s cubic-bezier(.2,1.1,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .shot[hidden]{display:none}
  .shot video{width:100%;border-radius:9px;display:block;background:#8fa3b5}
  .shot .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .shot .chip{flex:1 1 46%;padding:8px 0;text-align:center;letter-spacing:.16em}
  .shot .chip[disabled]{opacity:.55;cursor:default}

  @media (max-width:760px){
    .side{top:auto;bottom:120px;transform:none}
    .side .rule{height:40px}
    .brand{top:20px;left:20px}
    .tools{top:18px;right:16px}
    .track{left:20px;bottom:24px}
  }
  @media (max-height:520px){ .side h1{font-size:24px;margin-bottom:12px} .side .rule{display:none} }
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<canvas id="scene"></canvas>

<div id="ui">
  <div class="brand"><i></i><span class="lbl">Jellyfish Finger</span></div>

  <div class="tools">
    <button class="chip" id="tCam" aria-pressed="true">Camera</button>
    <button class="chip" id="tSound" aria-pressed="true">Sound</button>
    <button class="chip" id="tBeauty" aria-pressed="true">Beauty · 自然</button>
    <button class="chip" id="tStyle" aria-pressed="false">Jelly · 手绘</button>
    <button class="chip" id="tWarp" aria-pressed="true">Water · 弱</button>
    <button class="chip" id="tDots" aria-pressed="true">Dots</button>
  </div>

  <div class="side">
    <h1>follow<br>your<br>finger</h1>
    <div class="rule"></div>
    <p class="lbl">食指引导 · 靠近发光<br>快速划动 · 掀起水波</p>
  </div>

  <div class="track" id="track"><b></b><span class="lbl" id="trackTxt">寻找手部…</span></div>
  <div class="hint lbl" id="hint">举起一只手,让指尖进入画面</div>
  <div class="coach" id="coachDots"></div>

  <button class="rec" id="rec" title="录制 10 秒 (R)" aria-label="录制 10 秒" hidden>
    <svg viewBox="0 0 52 52"><circle class="trk" cx="26" cy="26" r="21"/><circle class="prg" cx="26" cy="26" r="21"/></svg>
    <i></i>
  </button>

  <div class="shot" id="shot" hidden>
    <video id="shotV" autoplay loop muted playsinline></video>
    <div class="row">
      <button class="chip" id="shotSave">视频</button>
      <button class="chip" id="shotGif">GIF</button>
      <button class="chip" id="shotShare" hidden>分享</button>
      <button class="chip" id="shotClose">关闭</button>
    </div>
  </div>
</div>

<div id="gate">
  <div class="card">
    <div class="halo"></div>
    <h2>Jellyfish Finger</h2>
    <p class="kicker">a pocket aquarium</p>
    <p>开启摄像头,抬起一只手。<br>指尖游到哪里,水母就跟到哪里。<br>画面只在本机处理,不会离开这台设备。</p>
    <button class="btn" id="start">开启摄像头</button>
    <button class="alt" id="skip">先用鼠标试试</button>
    <div class="note" id="note"></div>
  </div>
</div>

/* ============================ 状态 ============================ */
function mkHand(id){ return {
  id, on:false, x:0, y:0, tx:0, ty:0,       // 屏幕坐标:平滑后 / 原始目标
  vx:0, vy:0, speed:0, lastSeen:-1e9, rippleAt:0,
  pts:null,                                 // 21 个关键点(屏幕坐标)
  palmX:0, palmY:0,                         // 掌心
  side:'',                                  // 'L' / 'R',镜像后跟你看到的左右一致
  _pinch:1, pinching:false, pinchAt:0,      // 拇指-食指距离(按手掌归一化)/ 捏合状态
  open:1, holding:false, stillT:0           // 张开度 / 摊掌停住
}; }
const HANDS = [mkHand(0), mkHand(1)];
let hand = HANDS[0];                        // 主手:只需要一只手的逻辑都用它
let lastHandN = -1;
const nHands = ()=> (HANDS[0].on?1:0) + (HANDS[1].on?1:0);
const lastSeenAny = ()=> Math.max(HANDS[0].lastSeen, HANDS[1].lastSeen);
const ripples=[], bubbles=[], jellies=[];
let t=0;

/* ============================ 画布 ============================ */
let vc, vctx, vcw=0, vch=0;
let vs, vsctx, vsw=0, vsh=0;   // 柔化层(1/4 分辨率)   // 低分辨率摄像头缓冲(自带柔焦)
let bgGrad, washA, washB, vig;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W*DPR); cv.height = Math.floor(H*DPR);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);

  vcw = 420; vch = Math.max(2, Math.round(420*H/W));
  if(!vc){ vc = document.createElement('canvas'); vctx = vc.getContext('2d'); }
  vc.width = vcw; vc.height = vch;
  if(!vs){ vs = document.createElement('canvas'); vsctx = vs.getContext('2d'); }
  vsw = Math.max(2, Math.round(vcw/4)); vsh = Math.max(2, Math.round(vch/4));
  vs.width = vsw; vs.height = vsh;

  bgGrad = ctx.createLinearGradient(0,0,W*.35,H);
  bgGrad.addColorStop(0,   '#A6BFD0');
  bgGrad.addColorStop(.48, '#B6C8D6');
  bgGrad.addColorStop(1,   '#CFC6E0');

  washA = ctx.createRadialGradient(W*.18,H*.12,0, W*.18,H*.12, W*.85);
  washA.addColorStop(0,'rgba(175,232,214,.42)');
  washA.addColorStop(1,'rgba(175,232,214,0)');

  washB = ctx.createRadialGradient(W*.92,H*.9,0, W*.92,H*.9, W*.8);
  washB.addColorStop(0,'rgba(214,196,242,.46)');
  washB.addColorStop(1,'rgba(214,196,242,0)');

  vig = ctx.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.32, W*.5,H*.5, Math.max(W,H)*.78);
  vig.addColorStop(0,'rgba(120,140,160,0)');
  vig.addColorStop(1,'rgba(104,124,148,.34)');

  buildGrid();
  if(!hand.on){ hand.x=hand.tx=W*.5; hand.y=hand.ty=H*.5; }
}

/* ============================ 波点网格 ============================ */
let grid=[], gap=CFG.dotGap;
function buildGrid(){
  grid.length=0;
  gap = QUAL.dotGap;
  const cols = Math.ceil(W/gap)+1, rows = Math.ceil(H/gap)+1;
  const ox = (W-(cols-1)*gap)/2, oy=(H-(rows-1)*gap)/2;
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    grid.push({x:ox+i*gap, y:oy+j*gap, p:(i*0.7+j*1.1)});
  }
}

function drawGrid(){
  if(!showDots) return;
  const nR = ripples.length;
  for(let k=0;k<grid.length;k++){
    const d = grid[k];
    // 基础呼吸
    let w = Math.sin(t*0.8 + d.p*0.55)*0.5 + Math.sin(t*0.37 - d.p*0.31)*0.5;
    let energy = 0;
    // 涟漪推过
    for(let i=0;i<nR;i++){
      const r = ripples[i];
      const dist = hypot(d.x-r.x, d.y-r.y);
      const off = dist - r.r;
      if(off > -r.band && off < r.band){
        const f = Math.cos(off/r.band*Math.PI*0.5);
        energy += f*f*r.a;
      }
    }
    // 手的近场(两只手都算)
    for(let hi=0;hi<2;hi++){
      const h = HANDS[hi]; if(!h.on) continue;
      const dh = hypot(d.x-h.x, d.y-h.y);
      if(dh < 220) energy += (1-dh/220)*0.55;
    }
    const a = clamp(0.055 + w*0.03 + energy*0.62, 0, 0.75);
    if(a < 0.035) continue;
    const rad = 1.05 + w*0.35 + energy*3.4;
    ctx.beginPath();
    ctx.arc(d.x, d.y + energy*7*Math.sin(t*2+d.p), rad, 0, TAU);
    ctx.fillStyle = 'rgba(150,235,209,'+a.toFixed(3)+')';
    ctx.fill();
  }
}

/* ============================ 摄像头背景 ============================ */
function drawBackdrop(){
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);

  if(showCam && video.readyState >= 2 && video.videoWidth){
    // 1) 摄像头 → 低分辨率缓冲(镜像 + 覆盖裁切),缩放放大自带柔焦
    const vw=video.videoWidth, vh=video.videoHeight;
    const s = Math.max(vcw/vw, vch/vh);
    const dw = vw*s, dh = vh*s;
    const B = BEAUTY[beauty];
    vctx.save();
    vctx.filter = B.f;                                 // 提亮 / 微降对比
    vctx.translate(vcw,0); vctx.scale(-1,1);           // 镜像,像照镜子
    vctx.drawImage(video, (vcw-dw)/2, (vch-dh)/2, dw, dh);
    vctx.restore();
    vctx.filter = 'none';

    if(B.soft>0){
      // 1/4 降采样再放大 = 便宜的强模糊
      vsctx.drawImage(vc, 0,0,vcw,vch, 0,0,vsw,vsh);
      vctx.globalAlpha = B.soft;                       // 磨皮:模糊层压回去
      vctx.drawImage(vs, 0,0,vsw,vsh, 0,0,vcw,vch);
      vctx.globalCompositeOperation = 'screen';        // 柔光:高光晕开
      vctx.globalAlpha = B.glow;
      vctx.drawImage(vs, 0,0,vsw,vsh, 0,0,vcw,vch);
      vctx.globalCompositeOperation = 'soft-light';    // 一点血色
      vctx.globalAlpha = B.rosy;
      vctx.fillStyle = '#FFC9C2'; vctx.fillRect(0,0,vcw,vch);
      vctx.globalCompositeOperation = 'source-over';
      vctx.globalAlpha = 1;
    }

    // 2) 切片位移 = 水下折射;关掉时走一次干净的整幅绘制
    ctx.save();
    ctx.globalAlpha = 0.62;
    const k = WARP[warp];
    if(k<=0){
      ctx.drawImage(vc, 0,0,vcw,vch, 0,0,W,H);
    }else{
      const SL=48, sh=H/SL, ssh=vch/SL;
      const a1=9*k, a2=5*k, pad=a1+a2+2;
      for(let i=0;i<SL;i++){
        const p=i/SL;
        // 低频 → 相邻切片位移接近,不会出现错位撕裂
        const off = Math.sin(t*0.55 + p*3.4)*a1 + Math.sin(t*0.28 - p*6.1)*a2;
        ctx.drawImage(vc, 0, p*vch, vcw, ssh+1, off-pad, i*sh, W+pad*2, sh+1.5);
      }
    }
    ctx.restore();
  }

  // 3) 色彩水洗:薄荷 + 淡紫 + 奶油白
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = washA; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = washB; ctx.fillRect(0,0,W,H);
  ctx.restore();
  ctx.fillStyle='rgba(206,220,228,.30)'; ctx.fillRect(0,0,W,H);

  // 4) 缓慢流动的光影
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const y = H*(0.2+i*0.3) + Math.sin(t*0.25+i)*H*0.06;
    const g = ctx.createLinearGradient(0,y-90,0,y+90);
    g.addColorStop(0,'rgba(255,252,240,0)');
    g.addColorStop(.5,'rgba(255,252,240,'+(0.05+0.02*Math.sin(t*0.4+i*2))+')');
    g.addColorStop(1,'rgba(255,252,240,0)');
    ctx.fillStyle=g; ctx.fillRect(0,y-90,W,180);
  }
  ctx.restore();
}

/* ============================ 水母 ============================ */
class Jelly{
  constructor(i,n,small){
    this.spr = SPR[i % SPR.length];
    this.small = !!small;
    this.scale = small ? rnd(.30,.46) : rnd(.52,.92);
    this.size  = small ? rnd(26,44)   : rnd(46,92);
    this.idx = i; this.formA = i/n*TAU;
    this.depth = 1; this.dim = 1;      // 景深:reindex() 里按体型重算
    this.drop = 0;                     // 捏合 → 水滴程度
    this.holdMix = 0;                  // 手掌停住 → 编队程度
    this.birth = small ? 0 : 1;        // 召唤出来的要有个浮现过程
    this.aMul = 1; this.sizeMul = 1;
    this.x = rnd(W*.2,W*.8); this.y = rnd(H*.2,H*.8);
    this.vx=0; this.vy=0;
    this.angle = -Math.PI/2;
    this.pulse = rnd(0,TAU);
    this.pulseSpeed = rnd(1.0,1.5);
    this.orbit = i/n*TAU + rnd(-.3,.3);
    this.orbitR = rnd(170,300);
    this.orbitSpd = rnd(.07,.18)*(Math.random()<.5?-1:1);
    this.wander = rnd(0,TAU);
    this.glow = 0;
    this.spread = 0;
    // 触须摆动(切片位移,让贴图活起来)
    this.amp = rnd(9,20); this.swaySpd = rnd(.5,.9); this.ph = rnd(0,TAU);
    // ---- 手绘版:触手链 + 细触手 + 口腕 ----
    this.N = 20; this.seg = this.size*0.30;
    this.spine = [];
    for(let k=0;k<this.N;k++) this.spine.push({x:this.x, y:this.y+k*this.seg});
    // 细触须:一圈飘丝。铺开收窄到 1.05(原 1.7,太宽会糊成实心块),
    // 长度更参差、更细、末端更快消失 —— 越往下越稀,才有「飘散」的层次
    this.tent = [];
    const TN = 20;
    for(let k=0;k<TN;k++){
      const u = TN>1 ? k/(TN-1) : .5;
      this.tent.push({
        off:(u-.5)*this.size*1.05 + rnd(-4,4),
        amp:rnd(11,30), spd:rnd(.5,1.1), ph:rnd(0,TAU),
        w:rnd(.4,.85), len:rnd(.55,1.05), a:rnd(.10,.26)
      });
    }
    // 口腕:中间几条宽的,收窄铺开、加强中心感
    this.arms = [];
    for(let k=0;k<5;k++){
      this.arms.push({
        off:(k/4-.5)*this.size*.24, amp:rnd(8,16),
        spd:rnd(.7,1.3), ph:rnd(0,TAU), w:rnd(2.0,3.4), len:rnd(.34,.5)
      });
    }
  }

  // 跟最近的那只手;带迟滞,免得在两手中间来回横跳
  pick(){
    const A = HANDS[0].on, B = HANDS[1].on;
    if(!A && !B) return null;
    if(A !== B) return A ? HANDS[0] : HANDS[1];
    const d0 = hypot(this.x-HANDS[0].x, this.y-HANDS[0].y);
    const d1 = hypot(this.x-HANDS[1].x, this.y-HANDS[1].y);
    const cur = this.hRef && this.hRef.on ? this.hRef : null;
    const near = d0 < d1 ? HANDS[0] : HANDS[1];
    if(cur && cur !== near){
      const dc = cur === HANDS[0] ? d0 : d1;
      if(dc < Math.min(d0,d1)*1.28) return cur;
    }
    return near;
  }

  update(dt){
    const hd = this.hRef = this.pick();
    // 没手可跟(刚进画面 / 手刚移出去)也走自由漂浮 —— 别让下面的分支拿到 null,
    // 另外这个局部变量必须叫 hd:叫 H 会把画布高度 H 遮掉。
    const idle = !hd || (performance.now()-lastSeenAny()) > CFG.idleMs;
    this.orbit += this.orbitSpd*dt;
    this.wander += dt*0.6;

    // 手势状态平滑(只听自己跟的那只手)
    this.drop    = lerp(this.drop,    hd&&hd.pinching?1:0, Math.min(1,dt*5));
    this.holdMix = lerp(this.holdMix, hd&&hd.holding ?1:0, Math.min(1,dt*2.2));
    if(this.birth<1) this.birth = Math.min(1, this.birth + dt*1.25);

    let tx, ty, pull;
    if(idle){
      // 自由漂浮:围绕屏幕缓慢巡游
      tx = W*.5 + Math.cos(this.orbit*.7)*W*.3 + Math.sin(this.wander)*80;
      ty = H*.5 + Math.sin(this.orbit*.9)*H*.3 + Math.cos(this.wander*1.3)*60;
      pull = 130;
    }else{
      // 越"远"的水母轨道越大、反应越慢 —— 景深
      const r = this.orbitR * (1 + 0.12*Math.sin(this.wander)) * (0.62+0.38*this.depth);
      tx = hd.x + Math.cos(this.orbit)*r;
      ty = hd.y + Math.sin(this.orbit)*r*0.8;

      // 手掌停住 → 均分成一圈,整体缓慢旋转
      if(this.holdMix > 0.01){
        const R = 165 + this.idx%3*22;
        const a = this.formA + t*0.34;
        tx = lerp(tx, hd.palmX + Math.cos(a)*R,      this.holdMix);
        ty = lerp(ty, hd.palmY + Math.sin(a)*R*0.86, this.holdMix);
      }
      // 捏合 → 向指尖收拢成一小簇
      if(this.drop > 0.01){
        const R = 40 + (this.idx%4)*13;
        const a = this.orbit*2.4 + this.idx;
        tx = lerp(tx, hd.x + Math.cos(a)*R, this.drop);
        ty = lerp(ty, hd.y + Math.sin(a)*R, this.drop);
      }
      pull = 470*(0.62+0.38*this.depth);
    }

    const dx=tx-this.x, dy=ty-this.y, d=hypot(dx,dy)||1;
    this.pulse += dt*this.pulseSpeed*(idle?0.6:1);
    const beat = Math.max(0, Math.sin(this.pulse));           // 收缩喷射
    const acc = pull*(0.18+0.82*beat)*clamp(d/240,0,1);
    this.vx += dx/d*acc*dt;
    this.vy += dy/d*acc*dt;

    // 快速划动产生的水流推力
    for(let i=0;i<ripples.length;i++){
      const r=ripples[i];
      const ddx=this.x-r.x, ddy=this.y-r.y, dd=hypot(ddx,ddy)||1;
      const off = dd - r.r;
      if(off>-r.band && off<r.band){
        const f = (1-Math.abs(off)/r.band)*r.a*r.push;
        this.vx += ddx/dd*f*dt; this.vy += ddy/dd*f*dt;
      }
    }

    const drag = Math.exp(-1.5*dt);
    this.vx*=drag; this.vy*=drag;
    const sp = hypot(this.vx,this.vy), MAX=340;
    if(sp>MAX){ this.vx=this.vx/sp*MAX; this.vy=this.vy/sp*MAX; }

    this.x += this.vx*dt; this.y += this.vy*dt;
    const m=80;
    if(this.x<-m)this.x=W+m; if(this.x>W+m)this.x=-m;
    if(this.y<-m)this.y=H+m; if(this.y>H+m)this.y=-m;

    if(sp>14){
      let ta = Math.atan2(this.vy,this.vx);
      let diff = ((ta-this.angle+Math.PI)%TAU+TAU)%TAU - Math.PI;
      this.angle += diff*Math.min(1, dt*3.4);
    }

    // 靠近 → 发光 + 触须散开
    const dh = hd ? hypot(this.x-hd.x, this.y-hd.y) : 1e9;
    const near = hd ? clamp(1 - dh/CFG.nearGlow, 0, 1) : 0;
    const gPrev = this.glow;
    this.glow = lerp(this.glow, near, Math.min(1, dt*4));
    if(gPrev < .45 && this.glow >= .45) Snd.bell();
    this.spread = lerp(this.spread, near, Math.min(1, dt*3));

    // 触手链(手绘版用;开销很小,始终运行,切换时无需预热)
    const hx=Math.cos(this.angle), hy=Math.sin(this.angle);
    const head=this.spine[0];
    head.x = this.x - hx*this.size*.18;
    head.y = this.y - hy*this.size*.18;
    for(let k=1;k<this.N;k++){
      const q=this.spine[k-1], pt=this.spine[k];
      pt.x += (q.x-pt.x)*0.30; pt.y += (q.y-pt.y)*0.30;
      let ax=pt.x-q.x, ay=pt.y-q.y, ad=hypot(ax,ay);
      if(ad<0.001){ ax=-hx; ay=-hy; ad=1; }
      ax/=ad; ay/=ad;
      const bl=0.16;
      ax=ax*(1-bl)-hx*bl; ay=ay*(1-bl)-hy*bl;
      const nd=hypot(ax,ay)||1;
      pt.x = q.x + ax/nd*this.seg;
      pt.y = q.y + ay/nd*this.seg;
    }

  }


  draw(){
    const d=this.drop, b=this.birth*this.birth*(3-2*this.birth);
    this.sizeMul = (1 - 0.55*d) * (0.35+0.65*b);
    if(d < 0.985){
      this.aMul = this.dim * b * (1-d);
      ctx.save();
      ctx.globalAlpha = this.aMul;
      if(STYLE==='sprite') this.drawSprite(); else this.drawInk();
      ctx.restore();
    }
    if(d > 0.015) this.drawDrop(d, b);
  }

  // 捏合后的发光水滴
  drawDrop(d, b){
    const e = d*d*(3-2*d), gl=this.glow;
    const R = lerp(this.size*0.42, 11+this.size*0.09, e);
    const x=this.x, y=this.y;
    ctx.save();
    ctx.globalAlpha = this.dim*b*e;
    ctx.globalCompositeOperation='lighter';
    let g=ctx.createRadialGradient(x,y,0,x,y,R*4.6);
    g.addColorStop(0,'rgba(238,230,255,'+(0.20+gl*0.22)+')');
    g.addColorStop(.38,'rgba(214,200,248,0.07)');
    g.addColorStop(1,'rgba(214,200,248,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R*4.6,0,TAU); ctx.fill();
    g=ctx.createRadialGradient(x-R*.26,y-R*.30,0, x,y,R);
    g.addColorStop(0,'rgba(255,255,255,0.98)');
    g.addColorStop(.34,'rgba(250,244,255,0.60)');
    g.addColorStop(1,'rgba(226,212,252,0.10)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,R,0,TAU); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.strokeStyle='rgba(255,255,255,'+(0.34*e)+')'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y,R,0,TAU); ctx.stroke();
    ctx.restore();
  }

  strand(o, amp, spd, ph, width, lenF, col0, col1){
    const S=this.spine, N=Math.min(this.N, Math.max(4, Math.round(this.N*lenF)));
    const px=[], py=[];
    for(let k=0;k<N;k++){
      const a=S[k], b=S[Math.min(k+1,this.N-1)];
      let dx=b.x-a.x, dy=b.y-a.y, d=hypot(dx,dy)||1;
      const nx=-dy/d, ny=dx/d;
      const u=k/this.N;
      const taper = 1-u*0.55;
      const sway = Math.sin(t*spd + u*3.1 + ph)*amp*u*(1+this.spread*1.3)
                 + Math.sin(t*spd*0.43 - u*1.7 + ph)*amp*0.5*u;
      const lat = o*taper*(1+this.spread*0.8) + sway;
      px.push(a.x+nx*lat); py.push(a.y+ny*lat);
    }
    ctx.beginPath();
    ctx.moveTo(px[0],py[0]);
    for(let k=1;k<N-1;k++) ctx.quadraticCurveTo(px[k],py[k],(px[k]+px[k+1])/2,(py[k]+py[k+1])/2);
    ctx.lineTo(px[N-1],py[N-1]);
    const g=ctx.createLinearGradient(px[0],py[0],px[N-1],py[N-1]);
    g.addColorStop(0,col0); g.addColorStop(.55,col1); g.addColorStop(1,'rgba(255,250,255,0)');
    ctx.strokeStyle=g; ctx.lineWidth=width; ctx.lineCap='round';
    ctx.stroke();
  }

  // 海月水母(moon jelly):扁平半透明伞盖,几乎不发光;
  // 全缘一圈密而短的触须(不是从中心垂下的几根长丝,那样像蝌蚪);
  // 中央四条短口腕 + 四个马蹄形性腺环 —— 海月水母的标志。
  drawInk(){
    const gl=this.glow;

    // 1) 中央口腕:短、半透明,只保留原来 arms 的前几条,长度砍半
    ctx.save();
    for(let i=0;i<this.arms.length;i++){
      const A=this.arms[i];
      this.strand(A.off*this.sizeMul*0.6, A.amp*0.7, A.spd, A.ph, A.w*0.9, A.len*0.55,
        'rgba(248,244,255,'+(0.26+gl*0.22)+')',
        'rgba(214,200,244,'+(0.14+gl*0.12)+')');
    }
    ctx.restore();

    const s=this.size*this.sizeMul, pw=Math.sin(this.pulse);
    // 伞盖更扁:0.50,海月水母是浅碟形,不是高钟形
    const r=s*(1+0.05*pw), h=s*0.50*(1-0.06*pw);
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle+Math.PI/2);

    // 2) 全缘短触须:沿伞盖下缘整圈垂下,密、短、细。这是把「蝌蚪」变「水母」的关键
    ctx.lineWidth=0.8; ctx.lineCap='round';
    const RIM = Math.max(20, Math.round(30/Math.max(1,QUAL.tentStep)));
    for(let i=0;i<RIM;i++){
      const u=i/(RIM-1);
      const ex=-r + 2*r*u;
      const edgeY=Math.sin(u*Math.PI)*h*0.08;
      // 中间的略长、两侧的略短,整体不超过伞盖高度 —— 短才像海月
      const len=h*(0.45+0.55*Math.sin(u*Math.PI))*(0.7+this.spread*0.5)*(0.85+gl*0.4);
      const swayA=Math.sin(t*1.1+u*8+this.ph+i)*len*0.16;
      ctx.beginPath();
      ctx.moveTo(ex, edgeY);
      ctx.quadraticCurveTo(ex+swayA*0.5, edgeY+len*0.6, ex+swayA, edgeY+len);
      ctx.strokeStyle='rgba(240,248,255,'+(0.13+gl*0.16)+')';
      ctx.stroke();
    }

    // 3) 极淡外光晕(海月水母几乎不发光,只留一点体积感,不是发光球)
    ctx.globalCompositeOperation='lighter';
    let g=ctx.createRadialGradient(0,-h*.2,0, 0,-h*.2, r*(2.0+gl*1.0));
    g.addColorStop(0,'rgba(230,242,248,'+(0.08+gl*0.16)+')');
    g.addColorStop(.4,'rgba(214,230,244,'+(0.04+gl*0.08)+')');
    g.addColorStop(1,'rgba(206,224,240,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-h*.2,r*(2.0+gl*1.0),0,TAU); ctx.fill();
    ctx.globalCompositeOperation='source-over';

    // 4) 伞盖主体:浅碟形 + 扇贝下缘,半透明青白
    const SC = 12;
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.bezierCurveTo(-r*1.03,-h*1.6, r*1.03,-h*1.6, r, 0);
    for(let i=0;i<SC;i++){
      const x1  = r - (2*r)*((i+1)/SC);
      const mid = r - (2*r)*((i+0.5)/SC);
      const dip = h*0.09*(1 + 0.28*Math.sin(t*1.3 + this.pulse + i));
      ctx.quadraticCurveTo(mid, dip, x1, 0);
    }
    ctx.closePath();
    g=ctx.createRadialGradient(0,-h*.4,r*.05, 0,-h*.05,r*1.2);
    g.addColorStop(0,'rgba(255,255,255,'+(0.32+gl*0.22)+')');
    g.addColorStop(.5,'rgba(228,240,248,'+(0.16+gl*0.13)+')');
    g.addColorStop(.85,'rgba(206,224,240,'+(0.07+gl*0.08)+')');
    g.addColorStop(1,'rgba(200,220,238,0)');
    ctx.fillStyle=g; ctx.fill();
    ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,'+(0.30+gl*0.24)+')'; ctx.stroke();

    // 5) 四叶马蹄形性腺 —— 海月水母的标志,内部透出的四个半环
    ctx.strokeStyle='rgba(255,255,255,'+(0.22+gl*0.16)+')'; ctx.lineWidth=1.5;
    for(let i=0;i<4;i++){
      const a2 = i/4*TAU + Math.PI/4;
      const cx = Math.cos(a2)*r*0.30, cy = -h*0.55 + Math.sin(a2)*h*0.26;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r*0.18, h*0.24, a2, Math.PI*0.18, Math.PI*1.52);  // 不闭合 = 马蹄
      ctx.stroke();
    }

    // 6) 顶部很淡的高光(小、柔;不再是那个大发光球)
    ctx.globalCompositeOperation='lighter';
    g=ctx.createRadialGradient(0,-h*.6,0, 0,-h*.6, r*0.55);
    g.addColorStop(0,'rgba(255,255,255,'+(0.34+gl*0.22)+')');
    g.addColorStop(.4,'rgba(236,246,255,'+(0.12+gl*0.14)+')');
    g.addColorStop(1,'rgba(224,238,250,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-h*.6,r*0.55,0,TAU); ctx.fill();
    ctx.restore();
  }

  drawSprite(){
    const S=this.spr, img=S.img;
    if(!img.complete || !img.naturalWidth) return;
    const gl=this.glow, pw=Math.sin(this.pulse);
    const iw=img.naturalWidth, ih=img.naturalHeight;
    // 伞盖收缩:横向鼓、纵向缩
    const w=iw*this.scale*this.sizeMul*(1+0.055*pw);
    const h=ih*this.scale*this.sizeMul*(1-0.050*pw);
    const ax=-w*S.ax, ay=-h*S.ay;

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle+Math.PI/2);        // 贴图已转正:触须朝 +y
    ctx.globalCompositeOperation='lighter';  // 贴图是纯发光残差,叠加即可
    ctx.globalAlpha = (0.92+gl*0.08)*this.aMul;

    // 横向切片摆动:越往触须尾端摆幅越大;靠近时整束散开
    const SL=QUAL.slices, ssh=ih/SL, dh=h/SL;
    const amp=this.amp*(1+this.spread*1.5);
    for(let i=0;i<SL;i++){
      const u=i/SL;
      const off = Math.sin(t*this.swaySpd + u*2.6 + this.ph)*amp*u*u
                + Math.sin(t*this.swaySpd*0.47 - u*1.4 + this.ph)*amp*0.45*u;
      const fan = 1 + this.spread*0.34*u*u;   // 触须散开
      const sw = w*fan;
      ctx.drawImage(img, 0, i*ssh, iw, ssh+1,
                    ax-(sw-w)*0.5+off, ay+i*dh, sw, dh+1.2);
    }

    // 靠近 → 整体泛起一层辉光
    if(gl>0.02){
      ctx.globalAlpha = gl*0.5*this.aMul;
      const bw=w*1.10, bh=h*1.08;
      ctx.drawImage(img, -bw*S.ax, -bh*S.ay, bw, bh);
    }
    ctx.restore();
  }
}

/* 体型 → 景深:大的更近(更亮、反应更快),小的更远(更淡、更慢) */
function reindex(){
  const n = jellies.length;
  let lo=1e9, hi=-1e9;
  for(const j of jellies){ lo=Math.min(lo,j.size); hi=Math.max(hi,j.size); }
  const span = Math.max(1, hi-lo);
  for(const j of jellies){ j.depth = (j.size-lo)/span; j.dim = 0.58+0.42*j.depth; }
  jellies.sort((a,b)=>a.depth-b.depth);          // 远的先画,近的压在上面
  jellies.forEach((j,i)=>{ j.idx=i; j.formA = i/n*TAU; });
}

/* 张开手 → 召唤一只小水母 */
function spawnJelly(h){
  h = h || hand;
  if(jellies.length >= CFG.maxJellies) return false;
  const j = new Jelly(jellies.length, jellies.length+1, true);
  j.x = h.x + rnd(-20,20); j.y = h.y + rnd(-20,20);
  for(let k=0;k<j.N;k++){ j.spine[k].x=j.x; j.spine[k].y=j.y+k*j.seg; }
  jellies.push(j);
  j.hRef = h;
  reindex();
  addRipple(h.x, h.y, .85);
  Snd.spawn();
  return true;
}

/* ============================ 涟漪 / 气泡 ============================ */
function addRipple(x,y,power){
  ripples.push({x,y,r:12,a:clamp(power,.3,1),band:60,push:520*power,age:0});
  if(ripples.length>9) ripples.shift();
  Snd.swell(clamp(power,0,1));
}
function addBubble(x,y,power){
  bubbles.push({
    x:x+rnd(-26,26), y:y+rnd(-20,20),
    r:rnd(1.6,6.5), rise:rnd(26,72)*(0.6+power),
    drift:rnd(-16,16), ph:rnd(0,TAU), life:1
  });
  if(bubbles.length>QUAL.maxBub) bubbles.shift();
  Snd.plink(clamp(power,0,1));
}
function updateFX(dt){
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];
    r.age+=dt; r.r += (330 - r.age*90)*dt; r.band = 60+r.age*70;
    r.a -= dt*0.75;
    if(r.a<=0) ripples.splice(i,1);
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    b.y -= b.rise*dt; b.x += Math.sin(t*1.6+b.ph)*b.drift*dt;
    b.life -= dt*0.42;
    if(b.life<=0 || b.y<-20) bubbles.splice(i,1);
  }
}
function drawRipples(){
  for(let i=0;i<ripples.length;i++){
    const r=ripples[i];
    const n = Math.max(14, Math.round(r.r*0.30));
    const dr = 1.3 + r.a*2.2;
    ctx.fillStyle='rgba(160,240,215,'+(r.a*0.5).toFixed(3)+')';
    for(let k=0;k<n;k++){
      const a=k/n*TAU + r.age*0.3;
      ctx.beginPath();
      ctx.arc(r.x+Math.cos(a)*r.r, r.y+Math.sin(a)*r.r*0.92, dr, 0, TAU);
      ctx.fill();
    }
  }
}
function drawBubbles(){
  for(let i=0;i<bubbles.length;i++){
    const b=bubbles[i], a=clamp(b.life,0,1);
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU);
    ctx.strokeStyle='rgba(255,255,255,'+(a*0.5)+')'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(214,246,238,'+(a*0.16)+')'; ctx.fill();
    ctx.beginPath(); ctx.arc(b.x-b.r*.32,b.y-b.r*.34,b.r*.26,0,TAU);
    ctx.fillStyle='rgba(255,255,255,'+(a*0.65)+')'; ctx.fill();
  }
}

/* ============================ 手部指示 ============================ */
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
             [9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHand(){
  for(let hi=0;hi<2;hi++){
    const h = HANDS[hi]; if(!h.on) continue;
    if(h.pts){
      ctx.strokeStyle='rgba(190,245,228,.30)'; ctx.lineWidth=1.2;
      for(let i=0;i<BONES.length;i++){
        const a=h.pts[BONES[i][0]], b=h.pts[BONES[i][1]];
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,.4)';
      for(let i=0;i<h.pts.length;i++){
        ctx.beginPath(); ctx.arc(h.pts[i].x,h.pts[i].y,1.8,0,TAU); ctx.fill();
      }
    }
    const pr = 26 + Math.sin(t*2.2 + hi*1.7)*3;
    ctx.beginPath(); ctx.arc(h.x,h.y,pr,0,TAU);
    ctx.strokeStyle='rgba(160,240,214,.75)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(h.x,h.y,3.2,0,TAU);
    ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
  }

  // 两只手同时在 → 中间拉出一道流动的水流
  if(HANDS[0].on && HANDS[1].on){
    const a=HANDS[0], b=HANDS[1];
    const dx=b.x-a.x, dy=b.y-a.y, len=hypot(dx,dy);
    if(len>60 && len<Math.max(W,H)){
      const n = Math.min(40, Math.round(len/26));
      const px=-dy/len, py=dx/len;
      for(let i=0;i<n;i++){
        const u=(i/n + t*0.13) % 1;
        const bow = Math.sin(u*Math.PI)*Math.sin(t*0.8)*26;
        const x=a.x+dx*u+px*bow, y=a.y+dy*u+py*bow;
        const fade=Math.sin(u*Math.PI);
        ctx.beginPath(); ctx.arc(x,y,1.1+fade*1.5,0,TAU);
        ctx.fillStyle='rgba(150,235,209,'+(fade*0.38).toFixed(3)+')'; ctx.fill();
      }
    }
  }
}

/* ============================ 声音 ============================ */
/* 全部现场合成,不加载任何音频文件。

   音乐上不是「随机取五声音阶」,而是一个会缓慢平移的和声场:

     Dm9  →  Cadd9/6  →  B♭maj9  →  Am9  →  (回到 Dm9)

   四个九和弦保持同一种排列往下平移,不做功能性解决 —— 这就是 planing(平行和弦),
   拉威尔最好认的一个手法。所有发声事件都只从「当前和弦」里取音,所以无论怎么乱按
   都不会撞到不协和;旋律是从和弦里浮出来的,不是写死的。

   几个具体的做法:
     · 排列一律是「低音根+五度,上方三度/六度/九度」—— 竖琴式的宽排列,低音区不放窄音程
     · 铃声用钢片琴的泛音结构(第四泛音故意不谐),《鹅妈妈》里那个音色
     · 快速划动 = 竖琴滑奏,一串音扫上去
     · 两成概率把音升高一个全音当倚音,而且不解决 —— 挂在那儿就是味道所在
     · 和弦每 11 秒平移一站,放出新水母时也会推一站

   ┌─────────────────────────────────────────────────────────────┐
   │ 想改音色,只动这三个数:                                    │
   │   vol    总音量,0 ~ 1                                      │
   │   bright 末端低通的截止频率(Hz)。越低越闷越柔             │
   │   room   混响量,0 ~ 1。越大越空灵,也越远                  │
   │                                                             │
   │ 嫌音「高」的话,低通没什么用 —— 频谱重心是被音区决定的。    │
   │ 真正的开关是 bell() 里的 deg(i, 1),把 1 改成 0 整体降八度。│
   └─────────────────────────────────────────────────────────────┘ */
const Snd = {
  TONE: { vol:0.5, bright:2200, room:0.85 },

  ok:false, on:true, ac:null, master:null, tone:null, comp:null, recDest:null,
  conv:null, wet:null, noise:null, flowG:null, flowF:null,
  _bell:0, _plink:0, _swell:0, _flow:-1, _fieldT:0,
  BASE:146.83,                            // D3

  // 和声场。r = 根音相对 D 的半音数;v = 排列(相对根音的半音数)
  //   0=根 7=五度 14=九度 15=小三度+8度 16=大三度+8度
  //   21=大六度+8度 22=小七度+8度 23=大七度+8度 26=九度+2×8度
  FIELD:[
    { n:'Dm9',      r: 0, v:[0,7,15,22,26] },   // D  A  F  C  E
    { n:'Cadd9/6',  r:-2, v:[0,7,16,21,26] },   // C  G  E  A  D
    { n:'B♭maj9',   r:-4, v:[0,7,16,23,26] },   // B♭ F  D  A  C
    { n:'Am11',     r:-5, v:[0,7,15,22,29] }    // A  E  C  G  D
    // 顶音取 11 度(D)而不是 9 度(B):B 还原音会和上一站 B♭maj9 拖过来的
    // 根音差半音,五秒的铺开尾巴还没散,叠在一起会发浑
  ],
  field:0,
  FIELD_MS: 11000,

  init(){
    if(this.ok) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{ this.ac = new AC(); }catch(e){ return; }
    const ac = this.ac;

    // --- 主链路:master → 低通 → 压缩器 → 扬声器 ---
    // 低通放最后,每个声音都被削掉齿音,不用逐个去调
    this.tone = ac.createBiquadFilter();
    this.tone.type = 'lowpass';
    this.tone.frequency.value = this.TONE.bright;
    this.tone.Q.value = 0.4;               // Q 压到 0.4:截止点附近不要起峰,不然反而更刺

    // 压缩器只做兜底。压太狠会听起来「一直很响」,把强弱全抹平
    this.comp = ac.createDynamicsCompressor();
    this.comp.threshold.value = -24;
    this.comp.knee.value      = 30;
    this.comp.ratio.value     = 3;
    this.comp.attack.value    = 0.02;
    this.comp.release.value   = 0.45;

    this.master = ac.createGain();
    this.master.gain.value = this.on ? this.TONE.vol : 0;
    this.master.connect(this.tone);
    this.tone.connect(this.comp);
    this.comp.connect(ac.destination);

    // --- 录制总线:挂在压缩器后面 ---
    try{
      this.recDest = ac.createMediaStreamDestination();
      this.comp.connect(this.recDest);
    }catch(e){ this.recDest = null; }

    // --- 混响:指数衰减的噪声脉冲,现场算出来 ---
    // 前 25ms 留空当预延迟 —— 直达声和混响之间有这点间隙,空间感才出得来
    try{
      const sr = ac.sampleRate, len = Math.floor(sr*3.6), pre = Math.floor(sr*0.025);
      const imp = ac.createBuffer(2, len, sr);
      for(let c=0;c<2;c++){
        const d = imp.getChannelData(c);
        for(let i=pre;i<len;i++){
          const k = 1 - (i-pre)/(len-pre);
          d[i] = (Math.random()*2-1) * Math.pow(k, 2.2) * 0.7;
        }
      }
      this.conv = ac.createConvolver();
      this.conv.buffer = imp;
      this.wet = ac.createGain(); this.wet.gain.value = this.TONE.room;
      this.conv.connect(this.wet); this.wet.connect(this.master);
    }catch(e){ this.conv = null; }

    // --- 共用噪声缓冲 ---
    const nl = Math.floor(ac.sampleRate * 2);
    this.noise = ac.createBuffer(1, nl, ac.sampleRate);
    const nd = this.noise.getChannelData(0);
    for(let i=0;i<nl;i++) nd[i] = Math.random()*2-1;

    // --- 水流:常驻的带通噪声,音量跟着手速走 ---
    try{
      const src = ac.createBufferSource();
      src.buffer = this.noise; src.loop = true;
      this.flowF = ac.createBiquadFilter();
      this.flowF.type = 'bandpass';
      this.flowF.frequency.value = 300;
      this.flowF.Q.value = 0.5;            // Q 越低越像水,越高越像哨
      this.flowG = ac.createGain();
      this.flowG.gain.value = 0;
      src.connect(this.flowF); this.flowF.connect(this.flowG);
      this.flowG.connect(this.master);
      if(this.conv) this.flowG.connect(this.conv);
      src.start();
    }catch(e){ this.flowG = null; }

    this.ok = true;
    this._fieldT = performance.now();
    if(ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
    this.bloom();                          // 开场先把当前和弦铺开
  },

  toggle(){
    this.on = !this.on;
    if(this.ok){
      try{ this.master.gain.setTargetAtTime(this.on?this.TONE.vol:0, this.ac.currentTime, 0.06); }catch(e){}
    }
    return this.on;
  },

  live(){ return this.ok && this.on && this.ac.state !== 'suspended'; },

  /* ---------------- 和声 ---------------- */

  chord(){ return this.FIELD[this.field]; },

  // 当前和弦第 i 个音,再升 oct 个八度
  deg(i, oct){
    const c = this.chord(), v = c.v;
    const k = ((i % v.length) + v.length) % v.length;
    return this.BASE * Math.pow(2, (c.r + v[k] + (oct||0)*12)/12);
  },

  // 两成概率往上挂一个倚音,而且不解决 —— 拉威尔的招牌。
  // 半音的更尖锐、更法国,全音的更柔;四六开混着来
  color(f){
    if(Math.random() >= 0.22) return f;
    return f * Math.pow(2, (Math.random() < 0.4 ? 1 : 2)/12);
  },

  note(i){ return this.deg(i, 0); },      // 旧接口,留着兼容

  // 平移到下一站
  advance(){
    this.field = (this.field + 1) % this.FIELD.length;
    this._fieldT = performance.now();
    this.bloom();
  },

  // 和弦整体铺开一次:低音根+五度,上面九度。平移时听到的就是这个
  bloom(){
    if(!this.live()) return;
    this.voice('sine', this.deg(0,0), 0.045, 0.55, 5.0, true);
    this.voice('sine', this.deg(1,0), 0.032, 0.70, 4.4, true);
    this.voice('sine', this.deg(4,0), 0.016, 0.95, 3.6, true);
  },

  /* ---------------- 发声原语 ---------------- */

  // 带包络的单音。atk 是重点:低于 20ms 耳朵会听成「敲击」,拉长就变成「浮现」
  voice(type, f, peak, atk, dec, sendRev){
    const ac = this.ac, now = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, now);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), now+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, now+atk+dec);
    o.connect(g); g.connect(this.master);
    if(sendRev && this.conv) g.connect(this.conv);
    o.start(now); o.stop(now+atk+dec+0.05);
    o.onended = ()=>{ try{ g.disconnect(); o.disconnect(); }catch(e){} };
    return {o, g, now};
  },

  // 钢片琴:第四泛音故意偏 4%,金属感就是从这点不谐来的
  cel(f, peak, dec, atk){
    const a = atk || 0.05;
    this.voice('sine', f,         peak,       a,      dec,      true);
    this.voice('sine', f*2.001,   peak*0.34,  a*1.2,  dec*0.70, true);
    this.voice('sine', f*3.002,   peak*0.08,  a*1.4,  dec*0.45, true);
    this.voice('sine', f*4.16,    peak*0.035,  a,      dec*0.22, true);
  },

  // 一阵过滤噪声(水声)。起音占三分之一,涌上来而不是拍上来
  burst(peak, f0, f1, dur, q, sendRev){
    const ac = this.ac, now = ac.currentTime;
    const s = ac.createBufferSource();
    s.buffer = this.noise; s.loop = true;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(f0, now);
    bp.frequency.exponentialRampToValueAtTime(Math.max(f1,20), now+dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), now+dur*0.33);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    s.connect(bp); bp.connect(g); g.connect(this.master);
    if(sendRev && this.conv) g.connect(this.conv);
    s.start(now, Math.random()*1.5); s.stop(now+dur+0.05);
    s.onended = ()=>{ try{ g.disconnect(); bp.disconnect(); s.disconnect(); }catch(e){} };
  },

  /* ---------------- 事件 ---------------- */

  // 靠近水母:钢片琴一声。90ms 慢起音,没有「叮」的那一下
  bell(){
    if(!this.live()) return;
    const now = this.ac.currentTime;
    if(now - this._bell < 0.16) return;
    this._bell = now;
    const i = 2 + Math.floor(Math.random()*3);          // 取上方结构:三度 / 六度 / 九度
    this.cel(this.color(this.deg(i, 1)), 0.075, 2.6, 0.09);
  },

  // 张开手放出新水母:两个音往上叠,同时把和声推到下一站
  spawn(){
    if(!this.live()) return;
    const self = this;
    this.cel(this.deg(2,1), 0.055, 1.5, 0.08);
    setTimeout(()=>{ if(self.live()) self.cel(self.deg(4,1), 0.05, 1.9, 0.10); }, 170);
    setTimeout(()=>{ if(self.live()) self.advance(); }, 420);
  },

  // 捏合收拢:三个音一起往下掉一个平行和弦块 —— planing 听得最清楚的地方
  gather(){
    if(!this.live()) return;
    const self = this;
    [0,1,2].forEach(function(k){
      setTimeout(function(){
        if(!self.live()) return;
        // 整块下移两个半音,保持排列不变
        const f = self.deg(4-k, 1) * Math.pow(2, -2/12);
        self.cel(f, 0.05 - k*0.008, 1.4, 0.07);
      }, k*110);
    });
  },

  // 快速划动:竖琴滑奏 + 底下一层水声
  swell(power){
    if(!this.live()) return;
    const now = this.ac.currentTime;
    if(now - this._swell < 0.34) return;
    this._swell = now;
    this.burst(0.022+0.05*power, 380+300*power, 130, 1.5+0.8*power, 0.5, true);

    const self = this, n = 5 + Math.round(power*3);
    for(let k=0;k<n;k++){
      setTimeout(function(){
        if(!self.live()) return;
        const oct = k < 5 ? 1 : 2;
        self.cel(self.deg(k, oct), (0.030+0.022*power)*(1 - k/(n*1.7)), 1.2, 0.04);
      }, k*38);                                    // 38ms 一个音 ≈ 竖琴滑上去的速度
    }
  },

  // 气泡:和弦最上面那两个音,很轻,像水面的反光
  plink(power){
    if(!this.live()) return;
    const now = this.ac.currentTime;
    if(now - this._plink < 0.15) return;
    this._plink = now;
    const i = 3 + Math.floor(Math.random()*2);
    this.cel(this.deg(i, 1), 0.008+0.010*power, 0.75, 0.05);
  },

  // 每帧调用:手速 → 水流噪声;顺便管和声场的推进
  flow(speed){
    if(!this.ok) return;
    if(this.live() && performance.now() - this._fieldT > this.FIELD_MS) this.advance();
    if(!this.flowG) return;
    const v = clamp(speed/1500, 0, 1);
    if(Math.abs(v - this._flow) < 0.02) return;
    this._flow = v;
    try{
      const now = this.ac.currentTime;
      this.flowG.gain.setTargetAtTime(v*v*0.05, now, 0.3);
      this.flowF.frequency.setTargetAtTime(260 + v*460, now, 0.3);
    }catch(e){}
  }
};

/* ============================ GIF89a 编码器 ============================ */
/* 自己写的,不依赖任何库:中位切分取色板 + 有序抖动 + LZW。
   分帧调用,不会把主线程卡死。 */
const GIF = {

  // --- 中位切分:从采样像素里挑出一套自适应色板 ---
  palette(samples, maxColors){
    let boxes = [this._box(samples)];
    while(boxes.length < maxColors){
      // 每次切"体积×像素数"最大的那个盒子
      let bi = -1, best = -1;
      for(let i=0;i<boxes.length;i++){
        const b = boxes[i];
        if(b.px.length < 2) continue;
        const v = Math.max(b.r1-b.r0, b.g1-b.g0, b.b1-b.b0) * b.px.length;
        if(v > best){ best = v; bi = i; }
      }
      if(bi < 0) break;
      const b = boxes[bi];
      const ax = (b.r1-b.r0 >= b.g1-b.g0 && b.r1-b.r0 >= b.b1-b.b0) ? 0
               : (b.g1-b.g0 >= b.b1-b.b0) ? 1 : 2;
      b.px.sort((p,q)=>p[ax]-q[ax]);
      const mid = b.px.length >> 1;
      boxes.splice(bi, 1, this._box(b.px.slice(0,mid)), this._box(b.px.slice(mid)));
    }
    const pal = [];
    for(const b of boxes){
      let r=0,g=0,bl=0;
      for(const p of b.px){ r+=p[0]; g+=p[1]; bl+=p[2]; }
      const n = b.px.length || 1;
      pal.push([Math.round(r/n), Math.round(g/n), Math.round(bl/n)]);
    }
    while(pal.length < 2) pal.push([0,0,0]);
    return pal;
  },

  _box(px){
    let r0=255,g0=255,b0=255,r1=0,g1=0,b1=0;
    for(const p of px){
      if(p[0]<r0)r0=p[0]; if(p[0]>r1)r1=p[0];
      if(p[1]<g0)g0=p[1]; if(p[1]>g1)g1=p[1];
      if(p[2]<b0)b0=p[2]; if(p[2]>b1)b1=p[2];
    }
    return {px,r0,g0,b0,r1,g1,b1};
  },

  // 4×4 有序抖动,专门对付渐变背景的色带
  BAYER: [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5],

  // --- RGBA → 调色板索引 ---
  index(data, w, h, pal, cache, dither){
    const out = new Uint8Array(w*h);
    const n = pal.length;
    for(let y=0, i=0; y<h; y++){
      for(let x=0; x<w; x++, i++){
        const o = i*4;
        let r = data[o], g = data[o+1], b = data[o+2];
        if(dither){
          const d = (this.BAYER[(y&3)*4 + (x&3)]/16 - 0.47) * dither;
          r = r+d < 0 ? 0 : r+d > 255 ? 255 : r+d;
          g = g+d < 0 ? 0 : g+d > 255 ? 255 : g+d;
          b = b+d < 0 ? 0 : b+d > 255 ? 255 : b+d;
        }
        const key = ((r>>2)<<12) | ((g>>2)<<6) | (b>>2);
        let idx = cache[key];
        if(idx === 0xFFFF){
          let bd = 1e9;
          for(let k=0;k<n;k++){
            const p = pal[k];
            const dr = r-p[0], dg = g-p[1], db = b-p[2];
            const dd = dr*dr*3 + dg*dg*6 + db*db*1;   // 按视觉权重
            if(dd < bd){ bd = dd; idx = k; }
          }
          cache[key] = idx;
        }
        out[i] = idx;
      }
    }
    return out;
  },

  // --- LZW(严格按 GIF 规范:码长在"输出之后、下一次写入之前"加宽) ---
  lzw(px, minCode){
    const out = [];
    let block = [], cur = 0, bits = 0;
    const CLEAR = 1 << minCode, EOI = CLEAR + 1, INIT = minCode + 1, MAXMAX = 1 << 12;
    let size = INIT, maxcode = (1 << size) - 1;
    let next = CLEAR + 2, dict = new Map(), clearFlag = false;

    const flush = ()=>{ out.push(block.length); for(let i=0;i<block.length;i++) out.push(block[i]); block = []; };
    const put = (code)=>{
      cur |= code << bits; bits += size;
      while(bits >= 8){
        block.push(cur & 255); cur >>= 8; bits -= 8;
        if(block.length === 255) flush();
      }
      // 关键:用"本次写入之前"的 next 判断,写完才加宽
      if(next > maxcode || clearFlag){
        if(clearFlag){ size = INIT; maxcode = (1 << size) - 1; clearFlag = false; }
        else { size++; maxcode = size === 12 ? MAXMAX : (1 << size) - 1; }
      }
    };
    const clearBlock = ()=>{ dict = new Map(); next = CLEAR + 2; clearFlag = true; put(CLEAR); };

    put(CLEAR);
    if(px.length){
      let ent = px[0];
      for(let i=1;i<px.length;i++){
        const c = px[i], key = ent * 256 + c;
        const f = dict.get(key);
        if(f !== undefined){ ent = f; continue; }
        put(ent);
        ent = c;
        if(next < MAXMAX) dict.set(key, next++);
        else clearBlock();
      }
      put(ent);
    }
    put(EOI);
    if(bits > 0) block.push(cur & 255);
    if(block.length) flush();
    out.push(0);
    return out;
  },

  // --- 可增长的字节缓冲:几 MB 的 GIF 用普通数组存会吃掉十几倍内存 ---
  sink(){
    const S = { d:new Uint8Array(1<<16), n:0 };
    S.need = function(k){
      if(this.n + k <= this.d.length) return;
      let L = this.d.length;
      while(L < this.n + k) L *= 2;
      const b = new Uint8Array(L); b.set(this.d.subarray(0, this.n)); this.d = b;
    };
    S.push = function(){
      this.need(arguments.length);
      for(let i=0;i<arguments.length;i++) this.d[this.n++] = arguments[i] & 255;
    };
    S.out = function(){ return this.d.slice(0, this.n); };
    return S;
  },

  // --- 组装 ---
  begin(w, h, pal){
    const b = this.sink();
    const push = function(){ b.push.apply(b, arguments); };
    const u16 = (v)=>push(v & 255, (v >> 8) & 255);

    for(const c of 'GIF89a') push(c.charCodeAt(0));
    u16(w); u16(h);
    let bpp = 1; while((1 << bpp) < pal.length) bpp++;
    push(0x80 | 0x70 | (bpp - 1), 0, 0);
    for(let i=0;i<(1<<bpp);i++){
      const c = pal[i] || [0,0,0];
      push(c[0], c[1], c[2]);
    }
    // 无限循环
    push(0x21, 0xFF, 0x0B);
    for(const c of 'NETSCAPE2.0') push(c.charCodeAt(0));
    push(0x03, 0x01, 0, 0, 0x00);
    return {bytes:b, w, h, bpp};
  },

  frame(g, px, delayCs){
    const b = g.bytes;
    const u16 = (v)=>b.push(v & 255, (v >> 8) & 255);
    b.push(0x21, 0xF9, 0x04, 0x04);        // 图形控制:disposal = 1
    u16(delayCs);
    b.push(0, 0);
    b.push(0x2C); u16(0); u16(0); u16(g.w); u16(g.h); b.push(0);
    const min = Math.max(2, g.bpp);
    b.push(min);
    const data = this.lzw(px, min);
    for(let i=0;i<data.length;i++) b.push(data[i]);
  },

  end(g){
    g.bytes.push(0x3B);
    return g.bytes.out();
  }
};

/* ============================ 录屏分享 ============================ */
/* canvas.captureStream + Web Audio 的 MediaStreamDestination 合成一条流,
   所以导出的片子画面和声音都在。 */
const Rec = {
  ms:null, mr:null, chunks:[], on:false, timer:0, url:null, blob:null, ext:'webm',
  DUR: 10000,
  gc:null, gctx:null, gw:0, gh:0, gFrames:[], gLast:0, gBusy:false,
  GIF_FPS: 12, GIF_MAX: 60,          // 最多取 5 秒,免得内存和体积都吃太狠
  GIF_W: 440, GIF_COLORS: 128, GIF_DITHER: 12,   // 实测:128 色比 256 色小两成,
                                                 // 平均色差只差 0.08/255,肉眼看不出来
  btn:null, card:null, vid:null,

  supported(){ return !!(cv.captureStream && window.MediaRecorder); },

  mime(){
    const list=[
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',   // Safari
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for(const m of list){
      if(window.MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
    }
    return '';
  },

  init(){
    this.btn = document.getElementById('rec');
    this.card= document.getElementById('shot');
    this.vid = document.getElementById('shotV');
    if(!this.supported()) return;                 // 浏览器不支持就不显示按钮
    this.btn.hidden = false;
    this.btn.style.setProperty('--dur', (this.DUR/1000)+'s');
    this.btn.addEventListener('click', ()=> this.on ? this.stop() : this.start());
    document.getElementById('shotClose').addEventListener('click', ()=> this.close());
    document.getElementById('shotSave').addEventListener('click', ()=> this.save());
    document.getElementById('shotGif').addEventListener('click', ()=> this.gif());
    document.getElementById('shotShare').addEventListener('click', ()=> this.share());
    addEventListener('keydown', e=>{
      if(e.key==='r'||e.key==='R'){ this.on ? this.stop() : this.start(); }
    });
  },

  start(){
    if(this.on || !this.supported()) return;
    this.close();
    let tracks;
    try{ tracks = cv.captureStream(30).getVideoTracks(); }catch(e){ return; }
    if(Snd.ok && Snd.recDest) tracks = tracks.concat(Snd.recDest.stream.getAudioTracks());
    this.ms = new MediaStream(tracks);

    const m = this.mime();
    this.ext = m.indexOf('mp4')>=0 ? 'mp4' : 'webm';
    try{
      this.mr = new MediaRecorder(this.ms, m ? {mimeType:m, videoBitsPerSecond:8e6} : {});
    }catch(e){ return; }

    // GIF 用的低分辨率画面缓冲
    this.gw = Math.max(120, Math.min(this.GIF_W, Math.round(W*0.45)) & ~1);
    this.gh = Math.max(80, Math.round(this.gw*H/W) & ~1);
    if(!this.gc){ this.gc=document.createElement('canvas'); this.gctx=this.gc.getContext('2d',{willReadFrequently:true}); }
    this.gc.width=this.gw; this.gc.height=this.gh;
    this.gFrames = []; this.gLast = 0;

    this.chunks = [];
    this.mr.ondataavailable = e=>{ if(e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.onstop = ()=> this.finish();
    this.mr.start(250);

    this.on = true;
    this.btn.classList.remove('on'); void this.btn.offsetWidth;   // 重置进度环动画
    this.btn.classList.add('on');
    this.btn.title = '停止录制 (R)';
    this.timer = setTimeout(()=> this.stop(), this.DUR);
  },

  stop(){
    if(!this.on) return;
    clearTimeout(this.timer);
    this.on = false;
    this.btn.classList.remove('on');
    this.btn.title = '录制 10 秒 (R)';
    try{ this.mr.stop(); }catch(e){}
    if(this.ms) this.ms.getTracks().forEach(tr=>{ if(tr.kind==='video') tr.stop(); });
  },

  // 主循环每帧调用:按固定间隔抓一张缩略帧
  grab(now){
    if(!this.on || this.gFrames.length >= this.GIF_MAX) return;
    if(now - this.gLast < 1000/this.GIF_FPS) return;
    this.gLast = now;
    this.gctx.drawImage(cv, 0, 0, this.gw, this.gh);
    this.gFrames.push(this.gctx.getImageData(0,0,this.gw,this.gh).data);
  },

  // 分帧编码 GIF,不卡主线程
  async gif(){
    if(this.gBusy || this.gFrames.length < 4) return;
    this.gBusy = true;
    const btn = document.getElementById('shotGif');
    btn.disabled = true;
    const step = (msg)=>{ btn.textContent = msg; return new Promise(r=>setTimeout(r,0)); };

    try{
    await step('取色…');
    const F = this.gFrames, W2 = this.gw, H2 = this.gh;
    const samples = [];
    const fs = Math.max(1, Math.round(F.length/6));
    for(let i=0;i<F.length;i+=fs){
      const d = F[i];
      for(let k=0;k<W2*H2;k+=11) samples.push([d[k*4], d[k*4+1], d[k*4+2]]);
    }
    const pal = GIF.palette(samples, this.GIF_COLORS);
    const cache = new Uint16Array(1<<18).fill(0xFFFF);
    const g = GIF.begin(W2, H2, pal);
    const delay = Math.round(100/this.GIF_FPS);

    for(let i=0;i<F.length;i++){
      GIF.frame(g, GIF.index(F[i], W2, H2, pal, cache, this.GIF_DITHER), delay);
      if(i % 3 === 0) await step('编码 ' + Math.round(i/F.length*100) + '%');
    }
    const bytes = GIF.end(g);
    const blob = new Blob([bytes], {type:'image/gif'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = this.name().replace(/\.\w+$/, '.gif');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    btn.textContent = 'GIF ' + (bytes.length/1048576).toFixed(1) + 'M';
    setTimeout(()=>{ if(!this.gBusy) btn.textContent='GIF'; }, 3000);
    }catch(e){
      btn.textContent = 'GIF 失败';                    // 多半是内存不够,别把按钮永久锁死
      setTimeout(()=>{ if(!this.gBusy) btn.textContent='GIF'; }, 3000);
    }finally{
      btn.disabled = false;
      this.gBusy = false;
    }
  },

  finish(){
    if(!this.chunks.length) return;
    this.blob = new Blob(this.chunks, {type:this.mr.mimeType || 'video/webm'});
    this.chunks = [];
    if(this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(this.blob);
    this.vid.src = this.url;
    this.card.hidden = false;
    // 手机上优先给系统分享面板
    const f = this.file();
    const can = navigator.canShare && f && navigator.canShare({files:[f]});
    document.getElementById('shotShare').hidden = !can;
    const gb = document.getElementById('shotGif');
    gb.hidden = this.gFrames.length < 4; gb.textContent = 'GIF';
    Snd.bell();
  },

  name(){
    const d=new Date(), z=n=>String(n).padStart(2,'0');
    return 'jelly-dream-'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())
         + '-' + z(d.getHours()) + z(d.getMinutes()) + '.' + this.ext;
  },

  file(){
    if(!this.blob) return null;
    try{ return new File([this.blob], this.name(), {type:this.blob.type}); }catch(e){ return null; }
  },

  save(){
    if(!this.url) return;
    const a=document.createElement('a');
    a.href=this.url; a.download=this.name();
    document.body.appendChild(a); a.click(); a.remove();
  },

  async share(){
    const f=this.file(); if(!f) return;
    try{ await navigator.share({files:[f], title:'Jellyfish Finger'}); }catch(e){}
  },

  close(){
    this.card.hidden = true;
    this.vid.removeAttribute('src'); this.vid.load();
    if(!this.gBusy) this.gFrames = [];        // 几十兆的帧缓存,关掉就还回去
  }
};

/* ============================ 新手引导 ============================ */
/* 五步渐进,每完成一步自动跳下一步;做完一次就记住,不再打扰。 */
const Coach = {
  i:0, t:0, done:false, dots:null, box:null,
  steps:[
    {t:'举起一只手,让指尖进入画面',        ok:()=>hand.on},
    {t:'把指尖靠近水母,它们会亮起来',      ok:()=>jellies.some(j=>j.glow>.5)},
    {t:'快速划一下,掀起水波',              ok:()=>ripples.length>0},
    {t:'捏住拇指和食指,水母会收成水滴',    ok:()=>hand.pinching, hand:true},
    {t:'再张开手指,放出一只新水母',        ok:()=>jellies.length>CFG.jellies, hand:true},
    {t:'摊开手掌停住不动,它们会绕着你转',  ok:()=>hand.holding, hand:true},
    {t:'两只手一起举起来,中间会有水流',    ok:()=>HANDS[0].on&&HANDS[1].on, hand:true}
  ],
  start(){
    this.box = document.getElementById('hint');
    this.dots = document.getElementById('coachDots');
    try{ if(localStorage.getItem('jelly.coach')==='1') this.done=true; }catch(e){}
    if(this.done){ this.finish(); return; }
    this.render();
  },
  render(){
    if(!this.box) return;
    this.box.textContent = this.steps[this.i].t;
    if(this.dots){
      this.dots.innerHTML = this.steps.map((_,k)=>
        '<b class="'+(k<this.i?'ok':(k===this.i?'now':''))+'"></b>').join('');
    }
  },
  finish(){
    this.done = true;
    if(this.box) this.box.textContent = '食指引导 · 捏合成水滴 · 张开召唤 · 摊掌环绕 · 双手成流';
    if(this.dots) this.dots.innerHTML = '';
    try{ localStorage.setItem('jelly.coach','1'); }catch(e){}
  },
  update(dt){
    if(this.done) return;
    this.t += dt;
    if(this.t < .25) return;
    this.t = 0;
    // 鼠标模式没有手势,走完前三步就收尾
    if(mode==='pointer' && this.steps[this.i].hand){ this.finish(); return; }
    if(this.steps[this.i].ok()){
      this.i++;
      if(this.i >= this.steps.length) this.finish(); else this.render();
    }
  }
};

/* ============================ 主循环 ============================ */
let last=performance.now(), acc=0, frames=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  t += dt;

  // 鼠标模式下指针停着不动也算「在场」,不然一松手水母就自己漂走了
  if(mode==='pointer' && hand.on) hand.lastSeen = now;

  // 逐手推进:失联判定 → 平滑 → 手势状态 → 快速划动
  let maxSpeed = 0, best = null;
  for(let hi=0;hi<2;hi++){
    const h = HANDS[hi];
    if(h.on && now - h.lastSeen > 260){ h.on=false; h.holding=false; h.pinching=false; h.stillT=0; }
    if(!h.on) continue;

    const px=h.x, py=h.y;
    h.x = lerp(h.x, h.tx, Math.min(1, dt*14));
    h.y = lerp(h.y, h.ty, Math.min(1, dt*14));
    h.speed = lerp(h.speed, hypot(h.x-px, h.y-py)/Math.max(dt,0.001), 0.35);

    // 摊掌停住:张开 + 几乎不动,持续 0.9 秒
    h.stillT = h.speed < 75 ? h.stillT+dt : 0;
    h.holding = (h.open > 1.5) && !h.pinching && h.stillT > .9;

    // 快速划动 → 水波 + 气泡
    if(h.speed > CFG.swipeSpeed){
      const power = clamp((h.speed-CFG.swipeSpeed)/1400, .25, 1);
      if(now - h.rippleAt > 110){ addRipple(h.x, h.y, power); h.rippleAt = now; }
      const k = REDUCED ? 1 : Math.round(1+power*3);
      for(let i=0;i<k;i++) addBubble(h.x, h.y, power);
    }
    if(h.speed > maxSpeed) maxSpeed = h.speed;
    if(!best || h.lastSeen > best.lastSeen) best = h;
  }
  hand = best || hand;                       // 主手 = 最近一次被看到的那只
  const nh = nHands();
  if(nh !== lastHandN){ lastHandN = nh; setTrack(nh > 0); }

  Snd.flow(maxSpeed);
  updateFX(dt);
  for(let i=0;i<jellies.length;i++) jellies[i].update(dt);

  drawBackdrop();
  drawGrid();
  drawRipples();
  for(let i=0;i<jellies.length;i++) jellies[i].draw();
  drawBubbles();
  drawHand();
  ctx.fillStyle=vig; ctx.fillRect(0,0,W,H);
  Rec.grab(now);

  // 每 2 秒看一次实测帧率,自动升降画质
  acc+=dt; frames++;
  if(acc > 2.0){
    const fps = frames/acc;
    if(fps < 40) setTier(QUAL.tier+1);
    else if(fps > 56 && QUAL.tier > 0) setTier(QUAL.tier-1);
    acc=0; frames=0;
  }
  Coach.update(dt);
}

/* ============================ MediaPipe 手部识别 ============================ */
const CDNS=[
  './vendor/hands/',                                               // 本地打包,离线可用
  'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/',  // 兜底
  'https://unpkg.com/@mediapipe/hands@0.4.1646424915/'
];
let MP=CDNS[0];
function loadScript(src){
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=src; s.crossOrigin='anonymous';
    s.onload=res; s.onerror=()=>rej(new Error('load fail'));
    document.head.appendChild(s);
    setTimeout(()=>rej(new Error('timeout')), 15000);
  });
}
async function loadHandsLib(){
  for(let i=0;i<CDNS.length;i++){
    try{ await loadScript(CDNS[i]+'hands.js'); MP=CDNS[i]; return; }
    catch(e){ /* 换下一个源 */ }
  }
  throw new Error('MODEL');
}

function updateHand(h, pts, now){
  h.pts = pts;

  // --- 手势量,全部用手掌尺寸归一化,不受远近影响 ---
  const palm = hypot(pts[0].x-pts[9].x, pts[0].y-pts[9].y) || 1;
  h._pinch = hypot(pts[4].x-pts[8].x, pts[4].y-pts[8].y)/palm;
  let sum=0; for(const i of [8,12,16,20]) sum += hypot(pts[i].x-pts[0].x, pts[i].y-pts[0].y);
  h.open = sum/(4*palm);
  h.palmX = (pts[0].x+pts[5].x+pts[9].x+pts[17].x)/4;
  h.palmY = (pts[0].y+pts[5].y+pts[9].y+pts[17].y)/4;

  // --- 捏合:带迟滞,免得在阈值附近抖动 ---
  const wasP = h.pinching;
  h.pinching = wasP ? (h._pinch < .52) : (h._pinch < .36);
  if(!wasP && h.pinching){ h.pinchAt = now; Snd.gather(); }
  // --- 张开:捏住够久再松开 = 放出一只新水母 ---
  if(wasP && !h.pinching && now-h.pinchAt > 250) spawnJelly(h);

  // 捏合时目标取拇指与食指的中点,否则用食指指尖
  if(h.pinching){ h.tx=(pts[4].x+pts[8].x)/2; h.ty=(pts[4].y+pts[8].y)/2; }
  else { h.tx = pts[8].x; h.ty = pts[8].y; }

  if(!h.on){ h.x=h.tx; h.y=h.ty; h.on=true; }
  h.lastSeen = now;
}

function onResults(res){
  const L = res.multiHandLandmarks;
  if(!L || !L.length) return;
  const now = performance.now();
  const HND = res.multiHandedness || [];

  const packs = [];
  for(let i=0;i<L.length && i<2;i++){
    const lm = L[i];
    const pts = new Array(21);
    for(let k=0;k<21;k++) pts[k] = { x:(1-lm[k].x)*W, y:lm[k].y*H };   // 镜像对齐画面
    // MediaPipe 的 Left/Right 是按原始画面说的;画面已经镜像,这里翻回来,
    // side 就跟你眼睛看到的左右一致了。
    const raw = HND[i] && HND[i].label;
    packs.push({ pts:pts, side: raw==='Left' ? 'R' : (raw==='Right' ? 'L' : '') });
  }

  // 分槽位:先认左右手标签,认不出来再就近。
  // 两层一起做,是为了两手交叉或快速移动时,槽位不会互换 —— 一换,
  // 跟着这只手的那群水母就会瞬移到另一只手上。
  const used = [false,false];
  const take = (p, slot)=>{ used[slot]=true; HANDS[slot].side = p.side; updateHand(HANDS[slot], p.pts, now); };
  const rest = [];
  for(const p of packs){
    let hit = -1;
    if(p.side){
      for(let k=0;k<2;k++){
        const h = HANDS[k];
        if(!used[k] && h.on && h.side === p.side && now-h.lastSeen < 900){ hit = k; break; }
      }
    }
    if(hit >= 0) take(p, hit); else rest.push(p);
  }
  for(const p of rest){
    let slot = -1, bd = Infinity;
    for(let k=0;k<2;k++){
      if(used[k]) continue;
      const h = HANDS[k];
      const d = (h.on && now-h.lastSeen < 600)
        ? hypot(p.pts[8].x-h.tx, p.pts[8].y-h.ty)
        : 1e9 + k;                        // 空槽位优先级最低,且 0 号优先
      if(d < bd){ bd = d; slot = k; }
    }
    if(slot >= 0) take(p, slot);
  }
}

async function startCamera(){
  note.textContent='正在请求摄像头…';
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('NOAPI');
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:640}, height:{ideal:480} }, audio:false
    });
  }catch(err){
    const e=new Error('CAM'); e.name=err.name||''; throw e;
  }
  video.srcObject = stream;
  await video.play();

  note.textContent='正在加载手部模型…';
  await loadHandsLib();
  const hands = new window.Hands({ locateFile:(f)=>MP+f });
  hands.setOptions({
    maxNumHands:2, modelComplexity:0,
    minDetectionConfidence:.6, minTrackingConfidence:.6
  });
  hands.onResults(onResults);
  await hands.initialize();

  let busy=false;
  (function detect(){
    setTimeout(detect, 33);                     // 识别约 30fps,渲染仍是 60fps
    if(busy || video.readyState<2) return;
    busy=true;
    hands.send({image:video}).catch(()=>{}).finally(()=>{ busy=false; });
  })();

  mode='hand';
}

/* ============================ 鼠标兜底 ============================ */
function enablePointer(){
  mode='pointer';
  hint.textContent='移动鼠标 / 手指拖动 · 快速划动掀起水波';
  trackTxt.textContent='鼠标模式';
  const set=(x,y)=>{ if(!hand.on){hand.x=x;hand.y=y;hand.on=true;setTrack(true);} hand.tx=x;hand.ty=y;hand.lastSeen=performance.now(); hand.pts=null; };
  addEventListener('pointermove', e=>set(e.clientX,e.clientY), {passive:true});
  addEventListener('touchmove', e=>{const p=e.touches[0]; if(p) set(p.clientX,p.clientY);}, {passive:true});
}

function setTrack(on){
  track.classList.toggle('live', on);
  if(mode==='pointer') return;
  const n = nHands();
  trackTxt.textContent = n>1 ? '已捕捉到两只手' : (n===1 ? '已捕捉到手' : '寻找手部…');
  if(Coach.done && mode!=='pointer') hint.textContent = on
    ? '食指引导 · 捏合成水滴 · 张开召唤 · 摊掌环绕 · 双手成流'
    : '举起一只手,让指尖进入画面';
}

function reveal(){
  gate.classList.add('hide');
  ui.classList.add('on');
  setTimeout(()=>gate.remove(), 1000);
}

/* ============================ 启动 ============================ */
/* 摄像头为什么打不开:逐条给出可执行的答案 */
const framed = (function(){ try{ return window.self!==window.top; }catch(e){ return true; } })();
const secure = window.isSecureContext ||
               location.hostname==='localhost' || location.hostname==='127.0.0.1';

function diagnose(err){
  const serveTip = '把文件放在一个文件夹里,在该目录执行 <b>python3 -m http.server 8000</b>,再用浏览器打开 <b>http://localhost:8000/jelly-hand.html</b>';
  if(location.protocol==='file:')
    return '双击打开的本地文件(file://)不允许调用摄像头。<br>'+serveTip;
  if(!secure)
    return '当前地址不是 https 也不是 localhost,浏览器会屏蔽摄像头。<br>'+serveTip;
  if(err && err.message==='MODEL')
    return '摄像头正常,但手部模型没下载下来(网络或 CDN 被拦截)。换个网络重试,或先用鼠标模式。';
  if(err && err.message==='NOAPI')
    return '这个环境没有开放摄像头接口。<br>请下载文件后在浏览器里打开:'+serveTip;
  const n = err ? err.name : '';
  if(n==='NotAllowedError' || n==='SecurityError'){
    if(framed) return '页面被嵌在预览框里,摄像头权限没有放行。<br>请下载文件后单独打开:'+serveTip;
    return '浏览器拒绝了摄像头权限。<br>点地址栏左侧的摄像头/锁图标 → 允许 → 刷新页面。<br>macOS 还需在「系统设置 → 隐私与安全性 → 摄像头」里勾选你的浏览器。';
  }
  if(n==='NotFoundError' || n==='OverconstrainedError')
    return '没有找到可用的摄像头设备。';
  if(n==='NotReadableError')
    return '摄像头被别的程序占用了(Zoom / 腾讯会议 / 相机 App),关掉它们再刷新。';
  return '摄像头启动失败'+(n?'('+n+')':'')+'。已切换为鼠标模式。';
}

// 进入页面就先判断环境,不让人白等
if(location.protocol==='file:' || !secure || framed){
  note.innerHTML = (location.protocol==='file:'||!secure)
    ? '提示:当前是 file:// 或非安全地址,摄像头会被浏览器屏蔽,建议用 localhost 打开。'
    : '提示:页面在预览框内运行,摄像头可能被禁用。若失败请下载后单独打开。';
}

document.getElementById('start').addEventListener('click', async (e)=>{
  e.target.disabled = true;
  try{
    await startCamera();
    Snd.init();
    reveal();
  }catch(err){
    note.innerHTML = diagnose(err) + '<br><br>已切换为鼠标模式,可以直接体验。';
    e.target.textContent = '进入鼠标模式';
    e.target.disabled = false;
    e.target.onclick = ()=>{ enablePointer(); Snd.init(); reveal(); };
  }
});

document.addEventListener('visibilitychange', ()=>{

  if(document.hidden) Snd.ac.suspend(); else Snd.ac.resume();

addEventListener('resize', resize);
addEventListener('orientationchange', ()=>setTimeout(resize,300));
resize();
for(let i=0;i<CFG.jellies;i++) jellies.push(new Jelly(i, CFG.jellies));
reindex();
Coach.start();
Rec.init();
requestAnimationFrame(frame);

})();
